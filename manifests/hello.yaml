apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-site
data:
  default.conf.template: |
    server {
      listen 8080;
      keepalive_timeout 0;
      add_header Cache-Control "no-store" always;

      location = /whoami {
        default_type application/json;
        return 200 '{"pod":"${POD_NAME}","node":"${NODE_NAME}"}';
      }

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Hello from Kubernetes</title>
      <style>
        body { margin: 0; min-height: 100vh; display: grid; place-content: center; padding: 2rem; background: #10151c; color: #e8edf3; font-family: system-ui, sans-serif; }
        main { width: min(46rem, 90vw); }
        h1 { margin: 0 0 .5rem; font-size: 2.2rem; }
        p { margin: 0; color: #a9b4c0; }
        #now { margin-top: 1.5rem; min-height: 1.6em; font-size: 1.2rem; }
        #strip { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 1rem; min-height: 12px; }
        #strip span { width: 12px; height: 12px; border-radius: 2px; }
        #legend { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1rem; font-size: .9rem; color: #a9b4c0; }
        #legend i { display: inline-block; width: 10px; height: 10px; margin-right: .4rem; border-radius: 2px; }
      </style>
    </head>
    <body>
      <main>
        <h1>Hello from Kubernetes</h1>
        <p>Every square is one request. Each color is a different node, and red means a request failed.</p>
        <div id="now">Connecting...</div>
        <div id="strip"></div>
        <div id="legend"></div>
      </main>
      <script>
        const palette = ["#4cc38a", "#5aa9ff", "#f5b95f", "#c792ea"];
        const failedColor = "#ff5c5c";
        const nodes = new Map();
        const strip = document.getElementById("strip");
        const now = document.getElementById("now");
        const legend = document.getElementById("legend");
        const maxSquares = 180;

        function colorFor(node) {
          if (!nodes.has(node)) {
            nodes.set(node, palette[nodes.size % palette.length]);
            const entry = document.createElement("span");
            const swatch = document.createElement("i");
            swatch.style.background = nodes.get(node);
            entry.append(swatch, node);
            legend.append(entry);
          }
          return nodes.get(node);
        }

        function addSquare(color) {
          const square = document.createElement("span");
          square.style.background = color;
          strip.append(square);
          while (strip.children.length > maxSquares) {
            strip.firstChild.remove();
          }
        }

        async function tick() {
          try {
            const response = await fetch("/whoami", { cache: "no-store", signal: AbortSignal.timeout(2500) });
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            const who = await response.json();
            addSquare(colorFor(who.node));
            now.textContent = "Served by " + who.pod + " on " + who.node;
          } catch (error) {
            addSquare(failedColor);
            now.textContent = "Request failed: " + error.message;
          }
        }

        setInterval(tick, 1000);
        tick();
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: hello
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /whoami
              port: 8080
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: config
          configMap:
            name: hello-site
            items:
              - key: default.conf.template
                path: default.conf.template
        - name: html
          configMap:
            name: hello-site
            items:
              - key: index.html
                path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 8080
